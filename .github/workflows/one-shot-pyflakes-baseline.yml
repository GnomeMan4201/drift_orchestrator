name: One-shot Pyflakes baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/ratchet-pyflakes-debt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pyflakes
        run: python -m pip install pyflakes
      - name: Test ratchet helper
        run: python -m unittest tests.test_pyflakes_baseline -v
      - name: Freeze current debt baseline
        run: python tools/check_pyflakes_baseline.py --write-baseline --baseline .github/pyflakes-baseline.json
      - name: Prove generated baseline passes immediately
        run: python tools/check_pyflakes_baseline.py --baseline .github/pyflakes-baseline.json
      - name: Commit baseline only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pyflakes-baseline.json
          git diff --cached --check
          git commit -m "Freeze current Pyflakes debt baseline"
          git push origin HEAD:agent/ratchet-pyflakes-debt
