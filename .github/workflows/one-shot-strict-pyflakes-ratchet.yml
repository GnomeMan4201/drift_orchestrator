name: One-shot strict Pyflakes ratchet

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tighten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/strict-pyflakes-ratchet
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pyflakes
        run: python -m pip install pyflakes
      - name: Apply exact branch_merge cleanup
        run: python tools/_one_shot_patch_branch_merge.py
      - name: Verify branch_merge still parses
        run: python -m py_compile branch_merge.py
      - name: Test strict ratchet helper
        run: python -m unittest tests.test_pyflakes_baseline -v
      - name: Tighten baseline to cleaned tree
        run: python tools/check_pyflakes_baseline.py --write-baseline --baseline .github/pyflakes-baseline.json
      - name: Prove tightened baseline is exact
        run: python tools/check_pyflakes_baseline.py --baseline .github/pyflakes-baseline.json
      - name: Commit cleanup and tightened baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch_merge.py .github/pyflakes-baseline.json
          git diff --cached --check
          git commit -m "Tighten Pyflakes ratchet with first cleanup batch"
          git push origin HEAD:agent/strict-pyflakes-ratchet
