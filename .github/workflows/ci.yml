name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-analysis dependencies
        run: python -m pip install pyflakes

      - name: Recursively validate Python syntax and non-allowlisted lint diagnostics
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import subprocess
          import sys

          excluded_parts = {".git", ".venv", "venv", "__pycache__"}
          files = sorted(
              path
              for path in pathlib.Path(".").rglob("*.py")
              if not any(part in excluded_parts for part in path.parts)
          )

          if not files:
              print("No Python files found")
              sys.exit(1)

          syntax_errors = []
          for file in files:
              try:
                  ast.parse(file.read_text(encoding="utf-8"), filename=str(file))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  syntax_errors.append(f"{file}: {exc}")

          if syntax_errors:
              print("Python syntax validation failed:")
              print("\n".join(syntax_errors))
              sys.exit(1)

          proc = subprocess.run(
              [sys.executable, "-m", "pyflakes", *map(str, files)],
              capture_output=True,
              text=True,
              check=False,
          )
          diagnostics = [
              line
              for line in (proc.stdout + proc.stderr).splitlines()
              if line.strip() and "undefined name" not in line
          ]

          if diagnostics:
              print("Pyflakes reported non-allowlisted diagnostics:")
              print("\n".join(diagnostics))
              sys.exit(1)

          print(f"Validated {len(files)} Python files recursively")
          if proc.returncode:
              print("Note: existing 'undefined name' diagnostics remain allowlisted for now.")
          PY

  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter test dependencies
        run: python -m pip install pytest fastapi httpx uvicorn
      - name: Compile public adapter
        run: python -m py_compile gateway_adapter.py
      - name: Test public adapter contract offline
        run: python -m pytest -q tests/test_gateway_adapter.py
