name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: pip install pyflakes
      - name: Syntax check
        run: |
          python -m pyflakes *.py 2>&1 | grep -v "undefined name" || true
          python - <<'PY'
          import ast
          import pathlib
          import sys

          errors = []
          for file in pathlib.Path('.').glob('*.py'):
              try:
                  ast.parse(file.read_text())
              except SyntaxError as exc:
                  errors.append(f"{file}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All top-level Python files parse cleanly")
          PY

  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter test dependencies
        run: python -m pip install pytest fastapi httpx uvicorn
      - name: Compile public adapter
        run: python -m py_compile gateway_adapter.py
      - name: Test public adapter contract offline
        run: python -m pytest -q tests/test_gateway_adapter.py
