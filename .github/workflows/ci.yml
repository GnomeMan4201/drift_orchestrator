name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install static-analysis dependencies
        run: python -m pip install pyflakes

      - name: Recursively validate Python syntax
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          excluded_parts = {".git", ".venv", "venv", "__pycache__"}
          files = sorted(
              path
              for path in pathlib.Path(".").rglob("*.py")
              if not any(part in excluded_parts for part in path.parts)
          )

          if not files:
              print("No Python files found")
              sys.exit(1)

          errors = []
          for file in files:
              try:
                  ast.parse(file.read_text(encoding="utf-8"), filename=str(file))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f"{file}: {exc}")

          if errors:
              print("Python syntax validation failed:")
              print("\n".join(errors))
              sys.exit(1)

          print(f"Validated {len(files)} Python files recursively")
          PY

      - name: Verify research claim lineage
        run: python tools/verify_research_claims.py

      - name: Test validation gates
        run: python -m unittest tests.test_pyflakes_baseline tests.test_research_claim_verifier -v

      - name: Enforce Pyflakes debt ratchet
        run: python tools/check_pyflakes_baseline.py --baseline .github/pyflakes-baseline.json

  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install adapter test dependencies
        run: python -m pip install pytest fastapi httpx uvicorn
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile public adapter
        run: python -m py_compile gateway_adapter.py
      - name: Test public adapter contract offline
        run: python -m pytest -q tests/test_gateway_adapter.py
